name: Quality & Validation

# Runs comprehensive quality checks on all PRs and pushes to main:
# - Prettier (formatting)
# - ESLint (linting)
# - markdownlint (markdown quality)
# - Installation component tests (compilation)
# Keep this workflow aligned with `npm run quality` in `package.json`.

"on":
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: markdownlint
        run: npm run lint:md

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        # Note: build-docs.mjs runs link validation internally before building
        run: npm run docs:build

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test agent compilation components
        run: npm run test:install

      - name: Validate file references
        run: npm run validate:refs

      - name: Validate skills
        run: npm run validate:skills

  validate-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No `pip install` step needed: the compile pipeline is stdlib-only
      # (no pyyaml, requests, or third-party deps). If a future change adds a
      # non-stdlib import, add a `pip install -r <requirements>` step here.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate compile hashes
        run: npm run validate:compile

      - name: Test validate-compile
        run: npm run test:validate-compile

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Story 7.2 e2e job: stdlib-only Python (same contract as the validate-compile job
      # above — no pip install needed; compile.py + upgrade.py + bmad_customize.writer
      # are stdlib-only). If a future story adds a non-stdlib import, add `pip install` here.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run E2E lifecycle test
        run: npm run test:e2e

  fork-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for fork-specific content
        run: |
          # Patterns that indicate fork-specific or private content.
          # Checked against src/ only (installable content) — .github/, test/,
          # and tools/ are excluded (dev infrastructure may retain implementation
          # notes; this file itself contains the pattern strings).
          patterns=(
            'Phil M\b'
            'Phil Mahncke'
            'DN-FOLLOWUP-'
            'axonify'
            '/Users/philmahncke'
          )
          found=0
          for pat in "${patterns[@]}"; do
            hits=$(git grep -rn --perl-regexp -- "$pat" -- src/ 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "Fork-specific pattern found: $pat"
              echo "$hits"
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "Remove or generalize fork-specific content before contributing upstream."
            exit 1
          fi
          echo "No fork-specific content found."

  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required compile docs present
        run: |
          for f in docs/compile/author-migration-guide.md \
                    docs/compile/bmad-customize-walkthrough.md \
                    docs/compile/bmad-lock-schema.md \
                    docs/compile/explain-vocabulary.md \
                    docs/compile/quickstart.md; do
            [ -s "$f" ] || { echo "Missing or empty required doc: $f"; exit 1; }
          done
          echo "All required docs present."
